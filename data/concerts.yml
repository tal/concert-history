  notes: 'Festival ran Jun 7-10, 2012. Tal bought a resale wristband on Jun 4 and drove down, leaving before Phish
    closed Sunday night. Dated to Sat Jun 9, when Art vs. Science played a 30-minute afternoon set on the Sonic Stage
    and a midnight set at the Great Taste Lounge; Tal saw the Great Taste Lounge set. Flogging Molly played That Tent
    the same day. Days of the other acts Tal picked: Radiohead, Electric Guest, tUnE-yArDs and Two Door Cinema Club
    Fri Jun 8; Red Hot Chili Peppers Sat Jun 9; Oberhofer Fri Jun 8 (Great Taste Lounge) and Sat Jun 9 (Sonic Stage);
    Dale Earnhardt Jr. Jr. and Moon Taxi Thu Jun 7 (tents) and Fri Jun 8 (Sonic Stage), so Tal was there Fri and Sat
    at least. Chappo played Cafe Where Fri Jun 8 and the Sonic Stage Sun Jun 10. Tal does not think they saw Grouplove (Sun). Other billed artists are not treated as individually seen.'
